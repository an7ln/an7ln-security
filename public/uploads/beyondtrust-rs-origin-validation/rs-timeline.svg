<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-label="BeyondTrust BT26-05 / CVE-2026-102764 公开时间线">
  <rect width="980" height="500" fill="#0b1220"/>
  <text x="490" y="34" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="20" font-weight="600">BT26-05 / CVE-2026-102764 公开时间线</text>
  <text x="490" y="58" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">日期按 BeyondTrust 博客与 CISA 警报（UTC 日界；本地为 Asia/Shanghai）</text>

  <!-- axis -->
  <line x1="80" y1="120" x2="900" y2="120" stroke="#2a3957" stroke-width="3"/>

  <!-- points -->
  <!-- Aug 29 -->
  <circle cx="120" cy="120" r="8" fill="#ff6b6b"/>
  <text x="120" y="100" text-anchor="middle" fill="#ff8a8a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">08-29</text>
  <text x="120" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">零日利用</text>
  <text x="120" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">1 SaaS + 1 自托管</text>

  <!-- Sep 28 -->
  <circle cx="300" cy="120" r="8" fill="#f0a030"/>
  <text x="300" y="100" text-anchor="middle" fill="#f0c060" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">09-28</text>
  <text x="300" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">厂商狩猎发现</text>
  <text x="300" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">27 分钟内遏制 SaaS</text>

  <!-- Oct 8 -->
  <circle cx="480" cy="120" r="8" fill="#4dabf7"/>
  <text x="480" y="100" text-anchor="middle" fill="#74c0fc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">10-08</text>
  <text x="480" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">BT26-05 补丁发布</text>
  <text x="480" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">自托管 / SaaS</text>

  <!-- Oct 9 -->
  <circle cx="620" cy="120" r="8" fill="#51cf66"/>
  <text x="620" y="100" text-anchor="middle" fill="#8ce99a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">10-09</text>
  <text x="620" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">SaaS 全量已打补丁</text>
  <text x="620" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">自托管须手动确认</text>

  <!-- Oct 15 -->
  <circle cx="760" cy="120" r="8" fill="#9775fa"/>
  <text x="760" y="100" text-anchor="middle" fill="#b197fc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">10-15</text>
  <text x="760" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">协调披露</text>
  <text x="760" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">CVE + Mandiant</text>

  <!-- Oct 16 -->
  <circle cx="880" cy="120" r="8" fill="#ff922b"/>
  <text x="880" y="100" text-anchor="middle" fill="#ffa94d" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="600">10-16</text>
  <text x="880" y="160" text-anchor="middle" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">CISA KEV</text>
  <text x="880" y="178" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">敦促立即修补</text>

  <!-- boxes -->
  <rect x="60" y="220" width="400" height="230" rx="12" fill="#121a2b" stroke="#2a3957"/>
  <text x="260" y="252" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">影响范围（公告事实）</text>
  <text x="80" y="286" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 产品：Remote Support（原 Bomgar）</text>
  <text x="80" y="314" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 受影响：全部版本 ≤ 26.2.3</text>
  <text x="80" y="342" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 修复：BT26-05-RS（v24.3.1–26.2.3）</text>
  <text x="80" y="370" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• &lt;24.3.1：须先升级再打补丁</text>
  <text x="80" y="398" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• PRA：共享代码，厂商谨慎发补丁</text>
  <text x="80" y="426" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">CVSSv4 9.3 · CWE-290 · Critical</text>

  <rect x="520" y="220" width="400" height="230" rx="12" fill="#121a2b" stroke="#2a3957"/>
  <text x="720" y="252" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">利用与归因（公开层）</text>
  <text x="540" y="286" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 归因：ARMORY CASTLE</text>
  <text x="540" y="314" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">　（原 UNC5221 / Warp Panda）</text>
  <text x="540" y="342" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 厂商：截至披露仅知两家客户受影响</text>
  <text x="540" y="370" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 披露后：可能出现广谱利用</text>
  <text x="540" y="398" fill="#c9d4ea" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">• 本地日志不可单独信任</text>
  <text x="540" y="426" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">技术细节厂商仍暂缓公开</text>
</svg>
