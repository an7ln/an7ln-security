<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Sans SC, sans-serif">
<rect width="1200" height="640" fill="#0f172a"/>
<text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="bold">WordPress 核心升级窗口：信任边界示意（CVE-2026-119977，已修复）</text>
<text x="40" y="86" fill="#94a3b8" font-size="17">示意图仅表达公开公告中的失败模式与防守切点，不含请求构造、目录命名规则或任何可复现细节</text>
<g font-size="18">
<rect x="40" y="120" width="250" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="165" y="162" fill="#e2e8f0" text-anchor="middle">① 触发核心升级</text>
<text x="165" y="192" fill="#94a3b8" text-anchor="middle" font-size="15">后台 / 自动后台更新 / WP-CLI</text>
<rect x="340" y="120" width="250" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="465" y="162" fill="#e2e8f0" text-anchor="middle">② 由「当前已安装」</text>
<text x="465" y="190" fill="#e2e8f0" text-anchor="middle">的升级器解包新版本</text>
<rect x="640" y="120" width="250" height="110" rx="12" fill="#3b0d0d" stroke="#f87171" stroke-width="2"/>
<text x="765" y="155" fill="#fecaca" text-anchor="middle">③ 临时副本（含安装程序）</text>
<text x="765" y="183" fill="#fecaca" text-anchor="middle">位于 Web 可达的</text>
<text x="765" y="210" fill="#fecaca" text-anchor="middle">wp-content/upgrade 下</text>
<rect x="940" y="120" width="220" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="1050" y="162" fill="#e2e8f0" text-anchor="middle">④ 复制到位</text>
<text x="1050" y="190" fill="#e2e8f0" text-anchor="middle">并删除临时副本</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none"><path d="M290 175 H336"/><path d="M590 175 H636"/><path d="M890 175 H936"/></g>
<rect x="640" y="250" width="250" height="44" rx="8" fill="#7f1d1d"/>
<text x="765" y="279" fill="#fff" text-anchor="middle" font-size="17">升级窗口（秒级，取决于环境）</text>
<rect x="40" y="320" width="560" height="280" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
<text x="60" y="356" fill="#fca5a5" font-size="20" font-weight="bold">失败模式（公开描述层面）</text>
<g fill="#e2e8f0" font-size="17">
<text x="60" y="392">• 完整包升级的临时目录名可预测（4.7–7.1.3）</text>
<text x="60" y="424">• 临时副本可被 Web 服务器直接访问</text>
<text x="60" y="456">• 窗口内未认证访问者可能触达其中的安装程序</text>
<text x="60" y="488">• 结果：以 Web 服务器权限执行代码 → 整站失陷</text>
<text x="60" y="532" fill="#fbbf24">• 注意：升级到修复版的「那一次」仍由旧升级器执行，</text>
<text x="60" y="560" fill="#fbbf24">  公开研究称 5.9+ 站点该次目录名仍可预测</text>
</g>
<rect x="640" y="320" width="520" height="280" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
<text x="660" y="356" fill="#86efac" font-size="20" font-weight="bold">防守切点</text>
<g fill="#e2e8f0" font-size="17">
<text x="660" y="392">A. 升级前：Web 层禁止访问 wp-content/upgrade/</text>
<text x="660" y="420">   （确认返回 403；勿把 .htaccess 放进该目录）</text>
<text x="660" y="456">B. 升级到 7.1.4 或本分支修复版</text>
<text x="660" y="484">   （修复后临时目录随机命名）</text>
<text x="660" y="520">C. 或在 Web 根之外手工升级</text>
<text x="660" y="556">D. 升级后排查：异常管理员、未知插件、</text>
<text x="660" y="584">   upgrade 目录下的 PHP 请求与文件</text>
</g>
</svg>
