<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
  <style>
    .box{fill:#0f172a;stroke:#334155;stroke-width:1.5}
    .good{fill:#0f172a;stroke:#64748b;stroke-width:1.5}
    .bad{fill:#1c1917;stroke:#f59e0b;stroke-width:1.5}
    .t{fill:#e2e8f0}.sub{fill:#94a3b8;font-size:11px}
    .warn{fill:#fbbf24;font-size:11px}
    .lbl{fill:#7dd3fc;font-size:11px}
    .neq{fill:#f87171;font-size:16px;font-weight:700}
  </style>
  <text x="24" y="28" class="sub">授权测试复盘 · 审查面 ≠ 执行面（去敏示意）</text>

  <rect class="good" x="24" y="48" width="400" height="88" rx="8"/>
  <text class="lbl" x="40" y="72">审查面 · 模型读到的</text>
  <text class="t" x="40" y="98">papaparse.js</text>
  <text class="sub" x="40" y="118">干净实现（诱饵）· 审查放行</text>

  <text class="neq" x="444" y="102">≠</text>

  <rect class="bad" x="496" y="48" width="400" height="88" rx="8"/>
  <text class="lbl" x="512" y="72">执行面 · 解释器加载的</text>
  <text class="t" x="512" y="98">papaparse.min.js</text>
  <text class="sub" x="512" y="118">package.json 的 main 指向这里</text>

  <text class="warn" x="24" y="168">四层错位叠合：类型 · 读取 · 时序 · 现象</text>

  <rect class="box" x="24" y="184" width="210" height="86" rx="8"/>
  <text class="t" x="40" y="210">类型</text>
  <text class="sub" x="40" y="230">看到：.txt 后缀</text>
  <text class="sub" x="40" y="248">实际：zip（PK 头）</text>

  <rect class="box" x="246" y="184" width="210" height="86" rx="8"/>
  <text class="t" x="262" y="210">读取</text>
  <text class="sub" x="262" y="230">看到：干净文件</text>
  <text class="sub" x="262" y="248">实际：加载另一份</text>

  <rect class="box" x="468" y="184" width="210" height="86" rx="8"/>
  <text class="t" x="484" y="210">时序</text>
  <text class="sub" x="484" y="230">看到：事后审查</text>
  <text class="sub" x="484" y="248">实际：执行在前</text>

  <rect class="bad" x="690" y="184" width="206" height="86" rx="8"/>
  <text class="t" x="706" y="210">现象</text>
  <text class="sub" x="706" y="230">看到：进程挂起</text>
  <text class="sub" x="706" y="248">实际：连接已建立</text>
</svg>
