<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" width="1600" height="790" role="img" aria-label="CVE-2026-104935 / CVE-2026-111357 公开时间线（2026，公开日界）" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title>CVE-2026-104935 / CVE-2026-111357 公开时间线（2026，公开日界）</title><defs><marker id="a94a3b8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker><marker id="af87171" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker></defs><rect width="1600" height="790" fill="#0f172a"/>
<text x="40" y="62" font-size="32" fill="#e2e8f0" font-weight="700">CVE-2026-104935 / CVE-2026-111357 公开时间线（2026，公开日界）</text>
<line x1="70" y1="118" x2="70" y2="678" stroke="#94a3b8" stroke-width="2"/>
<circle cx="70" cy="118" r="10" fill="#94a3b8"/>
<text x="100" y="126" font-size="22" fill="#94a3b8" font-weight="700">07 月</text>
<text x="300" y="126" font-size="21" fill="#e2e8f0">25.1.3.0 发布（后被列为 25.1.2.x 分支的修复版本）</text>
<circle cx="70" cy="188" r="10" fill="#f87171"/>
<text x="100" y="196" font-size="22" fill="#f87171" font-weight="700">10-03</text>
<text x="300" y="196" font-size="21" fill="#e2e8f0">Volexity 观察到 UTA0576 开始反复利用该链（目标为当时最新的 22.8R2.4）</text>
<circle cx="70" cy="258" r="10" fill="#facc15"/>
<text x="100" y="266" font-size="22" fill="#facc15" font-weight="700">10-05</text>
<text x="300" y="266" font-size="21" fill="#e2e8f0">Volexity 在客户处启动调查，定位到 ICS 设备为根因；25.1.1.2 发布</text>
<circle cx="70" cy="328" r="10" fill="#94a3b8"/>
<text x="100" y="336" font-size="22" fill="#94a3b8" font-weight="700">10-10</text>
<text x="300" y="336" font-size="21" fill="#e2e8f0">Volexity 向情报客户提供相关指标</text>
<circle cx="70" cy="398" r="10" fill="#4ade80"/>
<text x="100" y="406" font-size="22" fill="#4ade80" font-weight="700">10-12</text>
<text x="300" y="406" font-size="21" fill="#e2e8f0">22.8R2.5 发布</text>
<circle cx="70" cy="468" r="10" fill="#4ade80"/>
<text x="100" y="476" font-size="22" fill="#4ade80" font-weight="700">10-13</text>
<text x="300" y="476" font-size="21" fill="#e2e8f0">Ivanti 公告 + CVE-2026-104935；CISA 列入 KEV 并发警报；Volexity 公开分析</text>
<circle cx="70" cy="538" r="10" fill="#f87171"/>
<text x="100" y="546" font-size="22" fill="#f87171" font-weight="700">10-15</text>
<text x="300" y="546" font-size="21" fill="#e2e8f0">提权步骤获独立编号 CVE-2026-111357（GitHub Advisory Database）</text>
<circle cx="70" cy="608" r="10" fill="#60a5fa"/>
<text x="100" y="616" font-size="22" fill="#60a5fa" font-weight="700">10-16 ~ 10-21</text>
<text x="300" y="616" font-size="21" fill="#e2e8f0">加拿大 CCCS、新加坡 CSA、马来西亚 CSM 等相继发布本地化通告</text>
<circle cx="70" cy="678" r="10" fill="#facc15"/>
<text x="100" y="686" font-size="22" fill="#facc15" font-weight="700">10-25</text>
<text x="300" y="686" font-size="21" fill="#e2e8f0">本文成稿：CVE-2026-104935 已有修复；CVE-2026-111357 截至成稿未查到公开修复版本</text>
<text x="40" y="752" font-size="18" fill="#94a3b8">日期取自厂商 / 政府 / Volexity 公开材料的日历日；以原文为准。</text>
</svg>
