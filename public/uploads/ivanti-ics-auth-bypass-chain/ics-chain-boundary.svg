<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ivanti Connect Secure 零日链（UTA0576，2026-10）：信任边界与修复状态" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title>Ivanti Connect Secure 零日链（UTA0576，2026-10）：信任边界与修复状态</title><defs><marker id="a94a3b8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker><marker id="af87171" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker></defs><rect width="1600" height="900" fill="#0f172a"/>
<text x="40" y="62" font-size="34" fill="#e2e8f0" font-weight="700">Ivanti Connect Secure 零日链（UTA0576，2026-10）：信任边界与修复状态</text>
<text x="40" y="104" font-size="19" fill="#94a3b8">仅示意失败模式类别；不含请求构造、路径、载荷或可复现步骤。来源：Ivanti / CISA / Volexity 公开材料</text>
<rect x="40" y="140" width="360" height="240" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
<text x="58" y="180" font-size="24" fill="#60a5fa" font-weight="700">① 互联网侧</text>
<text x="58" y="220" font-size="19" fill="#e2e8f0">未认证调用方</text>
<text x="58" y="252" font-size="19" fill="#e2e8f0">可达 ICS 公开登录入口</text>
<text x="58" y="284" font-size="19" fill="#e2e8f0">（无需凭据、无用户交互）</text>
<rect x="460" y="140" width="540" height="240" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
<text x="478" y="180" font-size="24" fill="#4ade80" font-weight="700">② 认证旁路 + ③ 代码执行</text>
<text x="478" y="220" font-size="19" fill="#e2e8f0">认证判定与实际路由目标</text>
<text x="478" y="252" font-size="19" fill="#e2e8f0">取自请求中的不同依据</text>
<text x="478" y="284" font-size="19" fill="#e2e8f0">→ 触达受保护的上传处理</text>
<text x="478" y="316" font-size="19" fill="#e2e8f0">→ 以 Web 服务账户执行代码</text>
<text x="478" y="348" font-size="19" fill="#e2e8f0">CVE-2026-104935 · CWE-290 · CVSS 8.6</text>
<rect x="1060" y="140" width="500" height="240" rx="14" fill="#1e293b" stroke="#f87171" stroke-width="3"/>
<text x="1078" y="180" font-size="24" fill="#f87171" font-weight="700">④ 本地提权到 root</text>
<text x="1078" y="220" font-size="19" fill="#e2e8f0">单独追踪：CVE-2026-111357</text>
<text x="1078" y="252" font-size="19" fill="#e2e8f0">截至 2026-10-25 未查到公开修复版本</text>
<text x="1078" y="284" font-size="19" fill="#e2e8f0">本文不展开任何细节</text>
<text x="1078" y="316" font-size="19" fill="#e2e8f0">（修复②③即可切断未认证入口）</text>
<line x1="400" y1="260" x2="452" y2="260" stroke="#94a3b8" stroke-width="4" marker-end="url(#a94a3b8)"/>
<line x1="1000" y1="260" x2="1052" y2="260" stroke="#94a3b8" stroke-width="4" marker-end="url(#a94a3b8)"/>
<line x1="1310" y1="380" x2="1310" y2="414" stroke="#f87171" stroke-width="4" marker-end="url(#af87171)"/>
<rect x="40" y="420" width="1520" height="220" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="3"/>
<text x="58" y="460" font-size="24" fill="#facc15" font-weight="700">⑤ 后渗透（公开报告的行为类别）</text>
<text x="58" y="500" font-size="19" fill="#e2e8f0">• 读取设备内保存的目录服务（LDAP / AD）服务账户凭据与设备配置</text>
<text x="58" y="532" font-size="19" fill="#e2e8f0">• 经 AD 服务账户查询 LAPS 本地管理员密码、BitLocker 恢复信息等高价值属性</text>
<text x="58" y="564" font-size="19" fill="#e2e8f0">• 解析设备上的流量抓包以收集明文认证材料；密码喷洒；内网 DNS 侦察</text>
<text x="58" y="596" font-size="19" fill="#e2e8f0">• 反取证：选择性删改调试 / 审计日志；仅内存改动 → 完整性检查工具（ICT）看不到</text>
<rect x="40" y="680" width="1520" height="180" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="720" font-size="24" fill="#94a3b8" font-weight="700">防守切点</text>
<text x="58" y="760" font-size="19" fill="#e2e8f0">• 升级：25.1.1.2 / 25.1.3.x / 22.8R2.5（22.8 分支 2027-01-31 EOL，优先迁到 25.1.x）</text>
<text x="58" y="792" font-size="19" fill="#e2e8f0">• 暴露窗口 ≥ 2026-10-03 的设备：网络 + 内存取证；ICT 干净 ≠ 未失陷</text>
<text x="58" y="824" font-size="19" fill="#e2e8f0">• 怀疑失陷：备份配置 → 出厂重置/重建 → 升级 → 恢复配置 → 轮换设备可触达的全部凭据与证书</text>
</svg>
