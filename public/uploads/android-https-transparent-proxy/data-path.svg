<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">
  <style>
    .box{fill:#0f172a;stroke:#334155;stroke-width:1.5;rx:8}
