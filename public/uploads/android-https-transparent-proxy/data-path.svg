  <rect x="580" y="155" width="240" height="45" rx="8" class="box"/>
  <text x="596" y="183" class="t">Burp（Support invisible proxying）</text>

  <path class="arrow" d="M125 130 L125 168"/>
  <path class="arrow" d="M210 200 L248 200"/>
  <path class="arrow" d="M430 195 C490 195 500 180 578 178"/>
  <text x="300" y="258" class="lbl">adb reverse tcp:9090</text>
  <text x="138" y="152" class="lbl">UID 转发</text>
</svg>
