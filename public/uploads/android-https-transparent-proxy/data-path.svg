    .sub{fill:#94a3b8;font-size:12px}
    .arrow{stroke:#38bdf8;stroke-width:2;fill:none;marker-end:url(#a)}
    .lbl{fill:#7dd3fc;font-size:11px}
    .phone{fill:#111827;stroke:#475569;stroke-width:1.5;rx:10}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="430" height="240" rx="12" class="phone"/>
  <text x="34" y="52" class="sub">Android 设备（Magisk DenyList / SELinux Enforcing）</text>

  <rect x="40" y="70" width="170" height="60" rx="8" class="box"/>
