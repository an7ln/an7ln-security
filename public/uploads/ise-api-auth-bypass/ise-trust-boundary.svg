<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Cisco ISE API 认证绕过信任边界示意">
  <rect width="980" height="520" fill="#0b1220"/>
  <text x="490" y="34" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="20" font-weight="600">CVE-2026-76460：管理面 API 信任边界</text>
  <text x="490" y="58" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">依据 Cisco 公开公告整理 · 非利用步骤 · 仅失败模式示意</text>
  <rect x="36" y="100" width="200" height="200" rx="14" fill="#121a2b" stroke="#ff6b6b"/>
  <text x="136" y="132" text-anchor="middle" fill="#ffb4b4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="600">未认证远程调用方</text>
  <text x="136" y="168" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Internet / 管理网</text>
  <text x="136" y="196" text-anchor="middle" fill="#b7c6e0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">无需有效凭据</text>
  <text x="136" y="220" text-anchor="middle" fill="#b7c6e0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">可达受影响 API</text>
  <text x="136" y="262" text-anchor="middle" fill="#ff8e8e" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">CVSS:N 网络可达</text>
  <path d="M246 200 L310 200" stroke="#ff6b6b" stroke-width="2.5" fill="none" marker-end="url(#arrRed)"/>
  <text x="278" y="188" text-anchor="middle" fill="#ff8e8e" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">认证控制不足</text>
  <rect x="320" y="100" width="240" height="200" rx="14" fill="#121a2b" stroke="#ffb020"/>
  <text x="440" y="132" text-anchor="middle" fill="#ffd28a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="600">ISE / ISE-PIC API</text>
  <rect x="350" y="150" width="180" height="36" rx="8" fill="#3a2a14" stroke="#ffb020"/>
  <text x="440" y="173" text-anchor="middle" fill="#ffe8c2" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">某 API 端点</text>
  <text x="440" y="214" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">认证控制不足</text>
  <text x="440" y="238" text-anchor="middle" fill="#b7c6e0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">与配置无关</text>
  <text x="440" y="272" text-anchor="middle" fill="#ffd28a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">绕过 Web 管理认证</text>
  <path d="M570 200 L634 200" stroke="#ffb020" stroke-width="2.5" fill="none" marker-end="url(#arrAmber)"/>
  <text x="602" y="188" text-anchor="middle" fill="#ffd28a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">未授权访问</text>
  <rect x="644" y="90" width="300" height="220" rx="14" fill="#121a2b" stroke="#ff6b6b"/>
  <text x="794" y="122" text-anchor="middle" fill="#ffb4b4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="600">管理面 / 设备影响</text>
  <rect x="674" y="142" width="240" height="32" rx="8" fill="#3a1d24" stroke="#ff6b6b"/>
  <text x="794" y="163" text-anchor="middle" fill="#ffe3e3" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">绕过 Web 管理界面认证</text>
  <text x="794" y="206" text-anchor="middle" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">成功利用后可能获得</text>
  <text x="794" y="228" text-anchor="middle" fill="#ffb4b4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">root 命令执行</text>
  <text x="794" y="262" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">Cisco：证据可能被擦除</text>
  <text x="794" y="284" text-anchor="middle" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">需交叉核对外部网络日志</text>
  <rect x="36" y="340" width="908" height="150" rx="14" fill="#121a2b" stroke="#2a3957"/>
  <text x="56" y="374" fill="#e8eefc" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">下游影响面（架构含义，非特定战役 IoC）</text>
  <text x="56" y="406" fill="#b7c6e0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">ISE 处于 NAC / Zero Trust 策略决策点：管理面失陷后，身份判定与准入策略本身处于风险之下。</text>
  <text x="56" y="432" fill="#b7c6e0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">公告：无有效 workaround；可用 iACL 限制到达设备的管理/控制面流量作为临时缓解，最终须打补丁。</text>
  <text x="56" y="458" fill="#8aa4d6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">检测：审查每个节点的 ise-kong/access.log 可疑用户名；勿仅依赖设备本地日志。</text>
  <defs>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff6b6b"/></marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffb020"/></marker>
  </defs>
</svg>
